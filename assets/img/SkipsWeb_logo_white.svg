<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="180" viewBox="0 0 900 180" version="1.1"
     xmlns="http://www.w3.org/2000/svg">

  <g fill="white" stroke="white">
    <!-- Ship wheel -->
    <circle cx="90" cy="90" r="42" stroke-width="5" fill="none"/>
    <circle cx="90" cy="90" r="14" stroke-width="4" fill="none"/>

    <!-- spokes -->
    <line x1="90" y1="30" x2="90" y2="150" stroke-width="4"/>
    <line x1="30" y1="90" x2="150" y2="90" stroke-width="4"/>
    <line x1="48" y1="48" x2="132" y2="132" stroke-width="4"/>
    <line x1="132" y1="48" x2="48" y2="132" stroke-width="4"/>

    <!-- handles -->
    <circle cx="90" cy="18" r="7"/>
    <circle cx="90" cy="162" r="7"/>
    <circle cx="18" cy="90" r="7"/>
    <circle cx="162" cy="90" r="7"/>
    <circle cx="39" cy="39" r="7"/>
    <circle cx="141" cy="39" r="7"/>
    <circle cx="39" cy="141" r="7"/>
    <circle cx="141" cy="141" r="7"/>
  </g>

  <!-- Text -->
  <text x="210" y="118"
        font-family="Georgia, Times New Roman, serif"
        font-size="92"
        fill="white">
    SkipsWeb
  </text>
</svg>
